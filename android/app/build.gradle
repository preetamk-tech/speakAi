plugins {
    id 'com.android.application'
}

android {
    namespace 'com.speakai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.speakai.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "speakAi-v${defaultConfig.versionName}-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // OkHttp for network calls and multipart file uploads
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Media & Audio Playback
    implementation 'androidx.media:media:1.7.0'

    // Lightweight on-device OCR via Google Play Services for scanned PDFs/images
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.0'
    implementation 'com.google.android.gms:play-services-tasks:18.1.0'
}
